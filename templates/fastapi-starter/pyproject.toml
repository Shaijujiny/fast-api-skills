[project]
name = "fastapi-starter"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
